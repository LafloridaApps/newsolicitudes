spring.application.name=newsolicitudes

server.port=8081

spring.datasource.url=jdbc:mysql://${HOST}:3306/${DB}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=90000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.newsolicitudes=DEBUG
logging.level.com.newsolicitudes.newsolicitudes.services.derivacioncreate=DEBUG

spring.threads.virtual.enabled=true


api.funcionario-url=http://${FUNCIONARIO}:8084

api.departamento-url=http://${DEPARTAMENTO}:8085

api.firma-url=https://${FIRMA_URL}

api.pdf-url=https://${PDF_URL}
                 
api.mail-url=http://${MAIL}:8087

api.consultafirma-url=http://${FIRMA}:8086

#doc.templates-path=/home/desarrollo/rrhh/documentos/templates/
doc.templates-path=${RUTA_TEMPLATES}
#doc.volume-path=/home/desarrollo/rrhh/documentos/
doc.volume-path=${RUTA_DOCUMENTOS}
app.link-url=https://appx.laflorida.cl/login

api.externo-url=http://${EXTERNO}:8083